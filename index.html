<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제부도 드라이브 동선</title>
<meta name="description" content="삿포로·오타루 3박 4일 맛집 동선 지도 (2026.12.3–12.6)">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kkhgold.github.io/jebudo-drive/">
<meta property="og:title" content="제부도 드라이브 동선">
<meta property="og:description" content="동탄에서 차로 떠나는 제부도 당일치기: 바닷길 · 빨간등대 · 매바위 · 궁평항 일몰">
<meta property="og:image" content="https://kkhgold.github.io/jebudo-drive/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 지도 전면 + 오른쪽 일정 패널 (모바일은 지도 위, 패널 아래) */
:root{
  --bg:#f3f6f9; --panel:#ffffff; --fg:#17202b; --muted:#5c6b7a; --line:#dbe3ea;
  --accent:#c2410c;      /* 등불 주황: 선택/진행 */
  --walk:#0f766e;        /* 도보 */
  --subway:#2563eb;      /* 지하철 */
  --jr:#15803d;          /* JR */
  --car:#7c3aed;         /* 버스/택시 */
  --display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e141b; --panel:#151d26; --fg:#e6edf3; --muted:#93a3b3; --line:#26323f;
  --accent:#fb923c; --walk:#2dd4bf; --subway:#60a5fa; --jr:#4ade80; --car:#a78bfa;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{display:grid;grid-template-columns:1fr 380px;height:100%}
#map{height:100%;min-height:300px;background:var(--bg)}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
header{padding:18px max(16px,env(safe-area-inset-right,0px)) 12px 20px;border-bottom:1px solid var(--line)}
h1{font:400 28px/1.15 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.tab{flex:1 1 0;min-width:64px;border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:8px;padding:7px 4px;font:500 13px var(--body);cursor:pointer;line-height:1.25}
.tab small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] small{color:#fff;opacity:.85}
.tab:focus-visible,.btn:focus-visible,.stop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 12px;font:500 13px var(--body);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.btn.kakao{background:#fee500;color:#191600;border-color:#fee500;font-weight:700}
.speed{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.stats{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--muted)}
.stats b{font:500 15px var(--mono);color:var(--fg);display:block;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid}
.list{overflow-y:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 24px 12px;flex:1}
.stop{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.stop:hover{background:var(--bg)}
.stop.active{border-color:var(--accent);background:var(--bg)}
.stop.done .num{background:var(--fg);color:var(--panel)}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--mono);
  border:1.5px solid var(--fg);color:var(--fg);background:var(--panel)}
.stop h3{margin:0;font-size:14.5px;font-weight:700}
.stop .meta{font-size:12px;color:var(--muted);font-family:var(--mono)}
.stop p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.leg{margin:2px 0 2px 21px;padding:2px 0 2px 19px;border-left:2px dashed var(--line);font-size:12px;color:var(--muted)}
.leg b{font-weight:500}
.note{font-size:11.5px;color:var(--muted);padding:10px 8px 0;border-top:1px solid var(--line);margin-top:10px}
/* map markers */
.pin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);
  background:var(--panel);color:var(--fg);border:2px solid var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pin.on{background:var(--accent);border-color:#fff;color:#fff}
.mover{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;
  background:#fff;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.leaflet-popup-content{font:13px/1.5 var(--body)}
.leaflet-popup-content b{font-size:14px}
.leaflet-container{font-family:var(--body)}
.tide{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:8px 10px}
.tide a{color:var(--accent)}
.dark-tiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
@media (max-width:820px){
  /* 모바일: 페이지 전체가 스크롤, 지도는 위에 고정 */
  html,body{height:auto}
  .app{display:block;height:auto}
  #map{position:sticky;top:0;height:46vh;z-index:5;border-bottom:1px solid var(--line)}
  aside{border-left:0;overflow:visible}
  .list{overflow:visible;flex:none}
  .stop{scroll-margin-top:calc(46vh + 12px)}
  h1{font-size:24px}
  header{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .list{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
</style>
</head>
<body>
<div class="app">
  <div id="map" role="region" aria-label="제부도 드라이브 동선 지도"></div>
  <aside>
    <header>
      <h1>제부도 드라이브</h1>
      <div class="sub">동탄 출발 당일치기 · 자동차 + 도보</div>
      <div class="tide"><b>⚠️ 바닷길 통행 시간 꼭 확인</b><br>제부도 바닷길은 물때에 따라 하루 두 번 열리고 닫혀요. 날짜를 정하면 <a href="https://www.hscity.go.kr" target="_blank" rel="noopener">화성시청</a> 또는 "제부도 물때표"에서 통행 시간을 확인하고 일정을 맞추세요. 바닷길이 닫혀 있으면 전곡항에서 <b>서해랑 케이블카</b>로 건너가면 돼요.</div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="controls">
        <button class="btn primary" id="play">▶ 동선 재생</button>
        <button class="btn" id="reset">처음으로</button>
        <button class="btn kakao" id="share">카톡으로 공유</button>
        <label class="speed" for="speed">속도
          <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </label>
      </div>
      <div class="stats">
        <div><b id="sStops">–</b>방문지</div>
        <div><b id="sWalk">–</b>도보 거리</div>
        <div><b id="sWalkMin">–</b>도보 시간</div>
      </div>
      <div class="legend">
        <span><i style="border-color:var(--walk);border-top-style:dashed"></i>도보</span>
        <span><i style="border-color:var(--subway)"></i>자동차</span>
        <span><i style="border-color:var(--car)"></i>케이블카</span>
      </div>
    </header>
    <div class="list" id="list"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- 데이터 (좌표는 근사값) ----------
const MODE = {
  car:   {label:"자동차",icon:"🚗", color:"--subway",dash:null,  kmh:45},
  cable: {label:"케이블카",icon:"🚡", color:"--car",dash:"8 6", kmh:10},
  walk:  {label:"도보",  icon:"🚶", color:"--walk",  dash:"2 8", kmh:4.5},
  subway:{label:"지하철",icon:"🚇", color:"--subway",dash:null,  kmh:30},
  jr:    {label:"JR",    icon:"🚆", color:"--jr",    dash:null,  kmh:60},
  bus:   {label:"투어버스",icon:"🚌", color:"--car",   dash:"8 6", kmh:55},
  taxi:  {label:"택시",  icon:"🚕", color:"--car",   dash:"8 6", kmh:22},
};
const JR_AIRPORT = [[43.0390,141.4740],[42.9860,141.5630],[42.8820,141.5780],[42.8280,141.6520]];
const JR_OTARU   = [[43.0790,141.2900],[43.1230,141.2400],[43.1550,141.1300],[43.1640,141.0600],[43.1880,141.0200]];

const HOTEL = [43.0627,141.3537];
const TOUR_1 = [[42.83,141.62],[42.66,141.55],[42.56,141.35]];      // 타키노 → 노보리베츠 (치토세·도마코마이 경유)
const TOUR_2 = [[42.55,141.00]];                                      // 노보리베츠 → 사이로 전망대
const TOUR_3 = [[42.70,140.90],[42.78,140.95]];                       // 사이로 → 나카야마 고개
const TOUR_4 = [[42.93,141.20],[43.00,141.30]];                       // 나카야마 고개 → 삿포로

const HOME = [37.2015,127.0735];
const ROAD_IN = [[37.2060,127.0200],[37.2160,126.9700],[37.2230,126.8700],[37.2150,126.7600],[37.1950,126.6900]];
const DAYS = [
 { date:"당일", dow:"코스", title:"동탄 → 제부도 → 궁평항 → 동탄",
   stops:[
    {n:"동탄1 아이파크 출발", ll:HOME, t:"09:30", d:"약 55km · 1시간 10분. 바닷길 열리는 시간에 맞춰 출발 시간 조정"},
    {n:"전곡항", ll:[37.1873,126.6520], t:"10:40", d:"요트 마리나 구경 · 바닷길이 닫혀 있으면 여기서 서해랑 케이블카 탑승", by:"car", via:ROAD_IN},
    {n:"제부도 바닷길", ll:[37.1766,126.6432], t:"10:50", d:"바다 갈라진 길 2.3km 드라이브. 통행 시간 외엔 진입 금지", by:"car", via:[[37.1742,126.6565]]},
    {n:"제부도 공영주차장", ll:[37.1655,126.6190], t:"11:00", d:"해수욕장 앞에 주차하고 걸어서 한 바퀴", by:"car", via:[[37.1745,126.6300],[37.1700,126.6260]]},
    {n:"해안 데크길 · 빨간 등대", ll:[37.1720,126.6172], t:"11:20", d:"탑재산 아래 바다 위 데크 산책로와 빨간 등대", by:"walk"},
    {n:"점심 · 조개구이와 바지락칼국수", ll:[37.1650,126.6180], t:"12:30", d:"해수욕장 앞 식당 거리", by:"walk", food:true},
    {n:"제부도 해수욕장 · 갯벌", ll:[37.1625,126.6178], t:"13:40", d:"썰물 때 갯벌 체험 (장화 대여 가능)", by:"walk"},
    {n:"매바위", ll:[37.1575,126.6185], t:"14:20", d:"섬 남쪽 끝 매 모양 바위. 물 빠지면 바로 앞까지 걸어갈 수 있어요", by:"walk"},
    {n:"제부도 공영주차장", ll:[37.1655,126.6190], t:"15:00", d:"바닷길 닫히기 전에 나오기!", by:"walk"},
    {n:"전곡항 카페", ll:[37.1880,126.6535], t:"15:30", d:"바다 보이는 카페에서 휴식", by:"car", via:[[37.1700,126.6260],[37.1745,126.6300],[37.1766,126.6432],[37.1742,126.6565]], food:true},
    {n:"궁평항", ll:[37.1155,126.6790], t:"16:40", d:"수산시장 회 · 낙조 전망대에서 일몰 (12월 일몰 약 17:20)", by:"car", via:[[37.1600,126.6800]], food:true},
    {n:"동탄1 아이파크 도착", ll:HOME, t:"19:00", d:"약 50km · 1시간 10분", by:"car", via:[[37.1500,126.7600],[37.1900,126.8700],[37.2060,127.0200]]},
   ]},
];

// ---------- 유틸 ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const R = 6371;
function dist(a,b){const toR=x=>x*Math.PI/180;const dLa=toR(b[0]-a[0]),dLo=toR(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function pathLen(p){let s=0;for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);return s;}
// 삿포로는 바둑판 도로 → 도보는 ㄱ자 경로로
function buildPath(a,b,s){
  if(s.via) return [a,...s.via,b];
  if(s.by==="walk"){const corner=[a[0],b[1]];return dist(a,corner)>0.03&&dist(corner,b)>0.03?[a,corner,b]:[a,b];}
  return [a,b];
}
function at(p,cum,f){const L=cum[cum.length-1]*f;let i=1;while(i<cum.length-1&&cum[i]<L)i++;
  const seg=cum[i]-cum[i-1]||1,t=(L-cum[i-1])/seg;return [p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t,i];}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- 지도 ----------
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const map = L.map("map",{zoomControl:true}).setView([43.06,141.35],13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, className: dark ? "dark-tiles" : "",
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const layer = L.layerGroup().addTo(map);

let day=0, legs=[], pins=[], mover=null, anim=null, playing=false, legIdx=0, legT=0;

function prepDay(i){
  const st=DAYS[i].stops; legs=[];
  for(let k=1;k<st.length;k++){
    const s=st[k], p=buildPath(st[k-1].ll,s.ll,s), cum=[0];
    for(let j=1;j<p.length;j++)cum.push(cum[j-1]+dist(p[j-1],p[j]));
    legs.push({from:k-1,to:k,mode:s.by,path:p,cum,km:cum[cum.length-1]});
  }
}
function pinIcon(n,on){return L.divIcon({className:"",html:`<div class="pin${on?" on":""}">${n}</div>`,iconSize:[26,26],iconAnchor:[13,13]});}
function moverIcon(m){return L.divIcon({className:"",html:`<div class="mover">${MODE[m].icon}</div>`,iconSize:[34,34],iconAnchor:[17,17]});}

function render(i){
  stop(); day=i; layer.clearLayers(); prepDay(i);
  document.querySelectorAll(".tab").forEach((t,k)=>t.setAttribute("aria-selected",k===i));
  const st=DAYS[i].stops;
  // 흐린 전체 경로 미리보기
  legs.forEach(l=>L.polyline(l.path,{color:css(MODE[l.mode].color),weight:3,opacity:.22,dashArray:MODE[l.mode].dash}).addTo(layer));
  pins=st.map((s,k)=>L.marker(s.ll,{icon:pinIcon(k+1,false),zIndexOffset:100})
    .bindPopup(`<b>${k+1}. ${s.n}</b><br>${s.t}${s.d?" · "+s.d:""}`).addTo(layer));
  map.fitBounds(L.latLngBounds(st.map(s=>s.ll)).pad(.12));
  // 통계
  const walk=legs.filter(l=>l.mode==="walk").reduce((a,l)=>a+l.km,0);
  document.getElementById("sStops").textContent=st.length+"곳";
  document.getElementById("sWalk").textContent=walk.toFixed(1)+" km";
  document.getElementById("sWalkMin").textContent="약 "+Math.round(walk/4.5*60)+"분";
  // 리스트
  const list=document.getElementById("list"); list.innerHTML="";
  const h=document.createElement("div"); h.className="sub"; h.style.padding="6px 8px 4px";
  h.innerHTML=`<b style="color:var(--fg)">${DAYS[i].date} (${DAYS[i].dow})</b> · ${DAYS[i].title}`; list.appendChild(h);
  st.forEach((s,k)=>{
    if(k>0){const l=legs[k-1],m=MODE[l.mode];const mins=Math.max(1,Math.round(l.km/m.kmh*60));
      const d=document.createElement("div");d.className="leg";d.style.borderLeftColor=css(m.color);
      d.style.borderLeftStyle=l.mode==="walk"?"dashed":"solid";
      d.innerHTML=`${m.icon} <b>${m.label}</b> ${l.km<1?Math.round(l.km*1000)+" m":l.km.toFixed(1)+" km"} · 약 ${mins}분`;list.appendChild(d);}
    const el=document.createElement("div"); el.className="stop"; el.tabIndex=0; el.id="stop"+k;
    el.innerHTML=`<div class="num">${k+1}</div><div><h3>${s.n}${s.food?' <span style="color:var(--accent);font-weight:500;font-size:12px">식사</span>':""}</h3>
      <div class="meta">${s.t}</div>${s.d?`<p>${s.d}</p>`:""}</div>`;
    const go=()=>{map.flyTo(s.ll,Math.max(map.getZoom(),15),{duration:.8});pins[k].openPopup();};
    el.onclick=go; el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
    list.appendChild(el);
  });
  const note=document.createElement("div");note.className="note";
  note.textContent="좌표·소요시간은 근사값이에요. 바닷길 통행 시간과 가게 영업시간은 출발 전에 꼭 확인하세요.";
  list.appendChild(note);
  mark(0);
}
function mark(k,done){
  document.querySelectorAll(".stop").forEach((e,j)=>{e.classList.toggle("active",j===k);e.classList.toggle("done",j<k);});
  pins.forEach((p,j)=>p.setIcon(pinIcon(j+1,j===k)));
  const el=document.getElementById("stop"+k); if(el) el.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});
}

// ---------- 애니메이션 ----------
let drawn=null;
function legDuration(l){ // 화면에서 보기 좋은 시간 (ms)
  const base = l.mode==="jr"?2600 : l.mode==="walk"?Math.min(2400,700+l.km*2200) : 1600;
  return base / +document.getElementById("speed").value;
}
function startLeg(){
  const l=legs[legIdx];
  drawn=L.polyline([l.path[0]],{color:css(MODE[l.mode].color),weight:l.mode==="walk"?4:5,opacity:.95,dashArray:MODE[l.mode].dash,lineCap:"round"}).addTo(layer);
  if(!mover) mover=L.marker(l.path[0],{icon:moverIcon(l.mode),zIndexOffset:1000}).addTo(layer);
  else mover.setIcon(moverIcon(l.mode));
  if(l.mode==="jr"||l.km>2) map.flyToBounds(L.latLngBounds(l.path).pad(.25),{duration:.6});
  else if(map.getZoom()<14) map.flyToBounds(L.latLngBounds(l.path).pad(1.2),{maxZoom:16,duration:.6});
  else if(!map.getBounds().pad(-.15).contains(l.path[l.path.length-1])) map.panTo(l.path[l.path.length-1]);
}
function frame(ts){
  if(!playing) return;
  const l=legs[legIdx];
  if(frame.last==null) frame.last=ts;
  legT += (ts-frame.last)/legDuration(l); frame.last=ts;
  const f=Math.min(1,legT), pt=at(l.path,l.cum,f);
  drawn.setLatLngs([...l.path.slice(0,pt[2]),[pt[0],pt[1]]]);
  mover.setLatLng([pt[0],pt[1]]);
  if(f>=1){
    drawn.setLatLngs(l.path); mark(l.to);
    legIdx++; legT=0;
    if(legIdx>=legs.length){ finish(); return; }
    frame.last=null; playing=false;
    setTimeout(()=>{ if(anim==="run"){playing=true;startLeg();requestAnimationFrame(frame);} }, 650/ +document.getElementById("speed").value);
    return;
  }
  requestAnimationFrame(frame);
}
function play(){
  const btn=document.getElementById("play");
  if(anim==="run"){ anim="pause"; playing=false; btn.textContent="▶ 계속"; return; }
  if(legIdx>=legs.length || anim==null){ render(day); legIdx=0; legT=0; }
  btn.textContent="❚❚ 일시정지";
  if(reduce){ // 애니메이션 최소화: 한 번에 그리기
    legs.forEach(l=>L.polyline(l.path,{color:css(MODE[l.mode].color),weight:4,dashArray:MODE[l.mode].dash}).addTo(layer));
    legIdx=legs.length; mark(DAYS[day].stops.length-1); finish(); return;
  }
  anim="run"; playing=true; frame.last=null;
  if(legT===0) startLeg();
  requestAnimationFrame(frame);
}
function finish(){ anim="done"; playing=false; document.getElementById("play").textContent="↻ 다시 재생";
  document.querySelectorAll(".stop").forEach(e=>e.classList.add("done")); }
function stop(){ anim=null; playing=false; mover=null; legIdx=0; legT=0; const b=document.getElementById("play"); if(b) b.textContent="▶ 동선 재생"; }

// ---------- UI ----------
const tabs=document.getElementById("tabs");
DAYS.forEach((d,i)=>{const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");
  b.innerHTML=`Day ${i+1}<small>${d.date} ${d.dow}</small>`;b.onclick=()=>{render(i);setTimeout(play,500);};tabs.appendChild(b);});
document.getElementById("play").onclick=play;
document.getElementById("reset").onclick=()=>render(day);
document.getElementById("share").onclick=async()=>{
  const b=document.getElementById("share"), url="https://kkhgold.github.io/jebudo-drive/";
  const data={title:"제부도 드라이브 동선",text:"제부도 드라이브 동선 지도",url};
  if(navigator.share){try{await navigator.share(data);}catch(e){} return;}
  try{await navigator.clipboard.writeText(url);b.textContent="링크 복사됨 · 카톡에 붙여넣기";}
  catch(e){prompt("이 링크를 복사해서 카톡에 붙여넣으세요",url);}
  setTimeout(()=>b.textContent="카톡으로 공유",2500);
};
let initial=0;
render(initial);
setTimeout(play,900);
</script>
